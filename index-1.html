{d:'medium',t:'Abraham Accords কত তারিখে স্বাক্ষরিত হয়?',o:['১৫ আগস্ট ২০২০','১৫ সেপ্টেম্বর ২০২০','১৫ অক্টোবর ২০২০','১৫ নভেম্বর ২০২০'],a:1,e:'১৫ সেপ্টেম্বর ২০২০ সালে UAE ও বাহরাইন একই দিনে ইসরায়েলের সাথে স্বাক্ষর করে।'},

{d:'hard',t:'NATO নিয়ে নিচের তথ্যগুলোর মধ্যে কোনগুলো সঠিক?',s:['NATO-র প্রতিষ্ঠাকালীন সদস্য ছিল ১২টি রাষ্ট্র।','ফিনল্যান্ড NATO-র ৩১তম সদস্য।','সুইডেন NATO-র ৩১তম সদস্য।','Article 4 হলো পরামর্শের বিধান।'],o:['i, ii, iv','i, ii, iii','ii, iii, iv','i, iii, iv'],a:0,e:'ফিনল্যান্ড ৩১তম (২০২৩) এবং সুইডেন ৩২তম (২০২৪) সদস্য। তাই iii ভুল।'},
{d:'hard',t:'কূটনীতির পরিভাষা নিয়ে নিচের কোন তথ্যটি ভুল?',s:['Agrément: রাষ্ট্রদূত নিয়োগের আগে গ্রহীতা দেশের পূর্বানুমোদন','Démarche: কূটনৈতিক আপত্তি জানানোর আনুষ্ঠানিক পদ্ধতি','Track-II Diplomacy: আনুষ্ঠানিক রাষ্ট্রীয় কূটনীতি','High Commissioner: কমনওয়েলথভুক্ত দেশগুলোর মধ্যে ব্যবহৃত পদবি'],o:['কেবল i','কেবল ii','কেবল iii','কেবল iv'],a:2,e:'আনুষ্ঠানিক রাষ্ট্রীয় কূটনীতি হলো Track-I। Track-II হলো বেসরকারি বা নাগরিক সমাজ পর্যায়ের অনানুষ্ঠানিক কূটনীতি।'},
{d:'vhard',t:'নিচের জোড়াগুলোর মধ্যে কোনগুলো সঠিকভাবে মিলেছে?',s:['Global Peace Index — Institute for Economics & Peace (IEP)','Corruption Perceptions Index — Transparency International','Rule of Law Index — Institute for Economics & Peace (IEP)','Global Terrorism Index — World Justice Project'],o:['i, ii','ii, iii','i, iv','iii, iv'],a:0,e:'Rule of Law Index প্রকাশ করে World Justice Project, আর Global Terrorism Index প্রকাশ করে IEP। তাই iii ও iv ভুল।'},

/* ========================= */

const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore(),app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";"),L=["ক","খ","গ","ঘ"],bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
let U,ans={},cf={},tick,end;
const R=["i","ii","iii","iv"],stm=s=>s?'<div class="st">'+s.map((x,i)=>R[i]+". "+x).join("<br>")+"</div>":"";

function authView(m=""){app.innerHTML=`<div class="card"><h2>মক টেস্ট কেন্দ্র</h2><p class="err">${m}</p>
<input id="n" placeholder="আপনার নাম (নতুন একাউন্টের জন্য)"><input id="e" type="email" placeholder="ইমেইল"><input id="p" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"><input id="c" placeholder="ব্যাচ কোড (নতুন একাউন্টের জন্য)">
<button id="li">লগইন করুন</button><button class="s" id="su">নতুন একাউন্ট খুলুন</button></div>`}

function home(){app.innerHTML=`<div class="card"><h2>${esc(U.displayName||"")}, স্বাগতম</h2><p><b>${EXAM.title}</b><br>${bn(EXAM.qs.length)}টি প্রশ্ন · ${bn(EXAM.min)} মিনিট · সঠিক +১, ভুল −০.৫০</p>
<button id="st">পরীক্ষা শুরু করুন</button><button class="s" id="lb">লিডারবোর্ড</button><button class="s" id="lo">লগআউট</button></div>`}

function exam(){ans={};cf={};end=Date.now()+EXAM.min*6e4;
app.innerHTML=`<div id="tm"><span id="tt"></span><span id="tc"></span></div>`+EXAM.qs.map((q,i)=>`<div class="card"><b>${bn(i+1)}. ${q.q}</b>${stm(q.s)}`+q.o.map((t,j)=>`<button class="o" data-i="${i}" data-j="${j}"><i>${L[j]}</i>${t}</button>`).join("")+`<label><input type="checkbox" style="width:auto" data-c="${i}"> দ্বিধা আছে</label></div>`).join("")+`<button id="sb">জমা দিন</button>`;
clearInterval(tick);tick=setInterval(()=>{const s=Math.max(0,Math.round((end-Date.now())/1e3)),t=document.getElementById("tt");if(!t)return clearInterval(tick);t.textContent="⏱ "+bn(Math.floor(s/60))+":"+bn(String(s%60).padStart(2,"0"));document.getElementById("tc").textContent="উত্তর: "+bn(Object.keys(ans).length)+"/"+bn(EXAM.qs.length);if(!s)submit()},300)}

async function submit(){clearInterval(tick);let r=0,w=0;
EXAM.qs.forEach((q,i)=>{if(ans[i]!==undefined)ans[i]===q.a?r++:w++});const sc=r-w*.5,ref=doc(db,"attempts",U.uid+"_"+EXAM.id);let first=false,fail=false;
try{if(!(await getDoc(ref)).exists()){await setDoc(ref,{uid:U.uid,examId:EXAM.id,name:U.displayName||"নামহীন",score:sc,right:r,wrong:w,t:Date.now()});first=true}}catch(e){fail=true}
app.innerHTML=`<div class="card"><h2>আপনার স্কোর: ${bn(sc)} / ${bn(EXAM.qs.length)}</h2><p>সঠিক ${bn(r)} · ভুল ${bn(w)} · উত্তর দেননি ${bn(EXAM.qs.length-r-w)}</p>
<p>${fail?'<span class="err">ফলাফল সেভ হয়নি, ইন্টারনেট বা Firestore Rules দেখুন।</span>':first?"এটি আপনার প্রথম চেষ্টা, তাই লিডারবোর্ডে গণ্য হয়েছে।":"আগে একবার দিয়েছেন, তাই এই চেষ্টা শুধু অনুশীলন। লিডারবোর্ডে প্রথমবারের স্কোর থাকবে।"}</p>
<button id="lb">লিডারবোর্ড দেখুন</button><button class="s" id="hm">হোম</button></div>`+EXAM.qs.map((q,i)=>`<div class="card"><b>${bn(i+1)}. ${q.q}</b>${stm(q.s)}${cf[i]?" ⚠":""}`+q.o.map((t,j)=>`<div class="o ${j===q.a?"ok":ans[i]===j?"no":""}"><i>${L[j]}</i>${t}</div>`).join("")+`<p class="ex">${ans[i]===undefined?"উত্তর দেননি। ":""}${q.e}</p></div>`).join("")}

async function board(){app.innerHTML=`<div class="card">লোড হচ্ছে...</div>`;let rows=[];
try{(await getDocs(query(collection(db,"attempts"),where("examId","==",EXAM.id)))).forEach(d=>rows.push(d.data()))}catch(e){app.innerHTML=`<div class="card err">লিডারবোর্ড লোড হয়নি।</div><button id="hm">হোম</button>`;return}
rows.sort((a,b)=>b.score-a.score||a.t-b.t);
app.innerHTML=`<div class="card"><h2>লিডারবোর্ড: ${EXAM.title}</h2><p>শুধু প্রথমবারের স্কোর গণ্য</p><table><tr><th>র‍্যাংক</th><th>নাম</th><th>স্কোর</th></tr>`+(rows.map((x,i)=>`<tr class="${x.uid===U.uid?"me":""}"><td>${bn(i+1)}</td><td>${esc(x.name)}</td><td>${bn(x.score)}</td></tr>`).join("")||"<tr><td colspan=3>এখনো কেউ পরীক্ষা দেয়নি।</td></tr>")+`</table></div><button id="hm">হোম</button>`}

const val=id=>document.getElementById(id).value.trim(),msg=x=>x.code==="auth/email-already-in-use"?"এই ইমেইলে একাউন্ট আছে":x.code==="auth/weak-password"?"পাসওয়ার্ড অন্তত ৬ অক্ষর দিন":"ইমেইল বা পাসওয়ার্ড ঠিক নয়";
app.onclick=e=>{const b=e.target,d=b.dataset;
if(d.j!==undefined){const i=+d.i;if(ans[i]===undefined){ans[i]=+d.j;b.classList.add("sel")}return}
if(d.c!==undefined){cf[d.c]=b.checked;return}
({li:()=>signInWithEmailAndPassword(auth,val("e"),val("p")).catch(x=>authView(msg(x))),
su:()=>{if(!val("n"))return authView("নাম লিখুন");if(val("c")!==BATCH_CODE)return authView("ব্যাচ কোড ভুল");createUserWithEmailAndPassword(auth,val("e"),val("p")).then(r=>updateProfile(r.user,{displayName:val("n")}).then(()=>{U=auth.currentUser;home()})).catch(x=>authView(msg(x)))},
st:exam,lb:board,hm:home,lo:()=>signOut(auth),sb:()=>confirm("জমা দেবেন?")&&submit()})[b.id]?.()};
onAuthStateChanged(auth,u=>{U=u;u?home():authView()});
</script></body></html>
